name: Build Linux

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev
          python -m pip install --upgrade pip

      - name: Build complete Linux package
        shell: bash
        run: |
          chmod +x ./build_linux.sh
          ./build_linux.sh

      - name: Verify packaged Linux release
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="dist/UwUConverterGUI"

          test -x "$PACKAGE_DIR/UwUConverterGUI"
          test -x "$PACKAGE_DIR/UwUConverterBatch"
          test -x "$PACKAGE_DIR/UwUConverterUpdater"
          test -x "$PACKAGE_DIR/UwUConverterBrowserHost"
          test -x "$PACKAGE_DIR/UwUConverterInstaller"
          test -x "$PACKAGE_DIR/cli/UwUConverter"
          test -x "$PACKAGE_DIR/install.sh"
          test -x "$PACKAGE_DIR/uninstall.sh"

          test -d "$PACKAGE_DIR/browser-extension/chromium"
          test -d "$PACKAGE_DIR/browser-extension/firefox"

          test -f "dist/UwUConverter-linux-x86_64.tar.gz"

          echo
          echo "Linux package contents:"
          find "$PACKAGE_DIR" -maxdepth 2 -type f -printf '%P\n' | sort

          echo
          echo "Release archive contents:"
          tar -tzf "dist/UwUConverter-linux-x86_64.tar.gz" | sort

          if ! tar -tzf "dist/UwUConverter-linux-x86_64.tar.gz" \
            | grep -q '^UwUConverterGUI/UwUConverterInstaller$'; then
            echo "ERROR: UwUConverterInstaller is missing from the release archive."
            exit 1
          fi

      - name: Upload Linux release
        uses: actions/upload-artifact@v4
        with:
          name: UwUConverter-linux-x86_64
          path: dist/UwUConverter-linux-x86_64.tar.gz
          if-no-files-found: error
