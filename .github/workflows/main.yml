name: Build Windows Installer

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller av pillow rawpy pdf2docx

      - name: Build UwUConverter
        run: |
          pyinstaller --clean --noconfirm --onefile `
            --name UwUConverter `
            --icon UwUConverter.ico `
            --add-data "UwUConverter.ico:." `
            Converter.py

      - name: Verify executable
        run: |
          if (!(Test-Path "dist\UwUConverter.exe")) {
            throw "PyInstaller did not create dist\UwUConverter.exe"
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Verify installer
        run: |
          if (!(Test-Path "installer-output\UwUConverter-Setup.exe")) {
            throw "Inno Setup did not create the installer"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UwUConverter-Windows-Installer
          path: installer-output/UwUConverter-Setup.exe
          if-no-files-found: error