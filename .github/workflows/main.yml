name: Build Windows Installer

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip

          pip install `
            pyinstaller `
            av `
            pillow `
            rawpy `
            pdf2docx `
            python-docx `
            odfpy `
            reportlab `
            pandas `
            openpyxl `
            xlrd `
            pyxlsb `
            xlwt

      - name: Build UwUConverter
        shell: powershell
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onedir `
            --name UwUConverter `
            --icon UwUConverter.ico `
            --add-data "UwUConverter.ico;." `
            Converter.py

      - name: Verify executable
        shell: powershell
        run: |
          $exe = "dist\UwUConverter\UwUConverter.exe"

          if (!(Test-Path $exe)) {
            throw "PyInstaller did not create $exe"
          }

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress

      - name: Build installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "installer.iss"

      - name: Verify installer
        shell: powershell
        run: |
          $installer = "installer-output\UwUConverter-Setup.exe"

          if (!(Test-Path $installer)) {
            throw "Inno Setup did not create $installer"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UwUConverter-Windows-Installer
          path: installer-output/UwUConverter-Setup.exe
          if-no-files-found: error

      - name: Add installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/UwUConverter-Setup.exe
