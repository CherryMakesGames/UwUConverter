name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Clean old build folders
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist-cli -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist-browser-host -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build-modern-shell -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist-modern-shell -ErrorAction SilentlyContinue

      - name: Generate Windows identity metadata
        shell: pwsh
        run: |
          python .\windows_modern_shell\generate_package_manifest.py

      - name: Build main GUI
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onedir `
            --windowed `
            --name UwUConverter `
            --icon UwUConverter.ico `
            --manifest windows_modern_shell/generated/UwUConverter.exe.manifest `
            --add-data "UwUConverter.ico;." `
            Converter.py

      - name: Build batch GUI
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name UwUConverterBatch `
            --icon UwUConverter.ico `
            BatchLauncher.py

      - name: Build CLI
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name UwUConverter `
            --distpath dist-cli `
            cli.py

      - name: Build updater
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name UwUConverterUpdater `
            --icon UwUConverter.ico `
            updater.py

          $updater = ".\dist\UwUConverterUpdater.exe"

          if (!(Test-Path $updater)) {
            throw "Missing updater executable: $updater"
          }

          if ((Get-Item $updater).Length -le 0) {
            throw "Updater executable is empty"
          }

      - name: Build browser native host
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name UwUConverterBrowserHost `
            --distpath dist-browser-host `
            browser_native_host.py

          $browserHost = ".\dist-browser-host\UwUConverterBrowserHost.exe"

          if (!(Test-Path $browserHost)) {
            throw "Missing browser native host: $browserHost"
          }

          if ((Get-Item $browserHost).Length -le 0) {
            throw "Browser native host is empty"
          }


      - name: Build browser extensions
        shell: pwsh
        run: |
          python .\build_browser_extensions.py

          if (!(Test-Path ".\browser_extension\dist\UwUConverter-Chromium.zip")) {
            throw "Missing Chromium extension ZIP"
          }

          if (!(Test-Path ".\browser_extension\dist\UwUConverter-Firefox.zip")) {
            throw "Missing Firefox extension ZIP"
          }

      - name: Build Windows 11 modern context menu
        shell: pwsh
        run: |
          .\windows_modern_shell\build_modern_shell.ps1

          foreach ($file in @(
            ".\dist-modern-shell\UwUConverterShell.dll",
            ".\dist-modern-shell\UwUConverterShell.msix",
            ".\dist-modern-shell\UwUConverterShell.cer"
          )) {
            if (!(Test-Path $file)) {
              throw "Missing modern shell artifact: $file"
            }

            if ((Get-Item $file).Length -le 0) {
              throw "Modern shell artifact is empty: $file"
            }
          }

      - name: Assemble Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ".\dist\UwUConverter\cli" | Out-Null

          Copy-Item `
            ".\dist\UwUConverterBatch.exe" `
            ".\dist\UwUConverter\UwUConverterBatch.exe" `
            -Force

          Copy-Item `
            ".\dist-cli\UwUConverter.exe" `
            ".\dist\UwUConverter\cli\UwUConverter.exe" `
            -Force

          Copy-Item `
            ".\dist\UwUConverterUpdater.exe" `
            ".\dist\UwUConverter\UwUConverterUpdater.exe" `
            -Force

          Copy-Item `
            ".\dist-browser-host\UwUConverterBrowserHost.exe" `
            ".\dist\UwUConverter\UwUConverterBrowserHost.exe" `
            -Force


          New-Item -ItemType Directory -Force ".\dist\UwUConverter\browser-extension" | Out-Null

          Copy-Item `
            ".\browser_extension\chromium" `
            ".\dist\UwUConverter\browser-extension\chromium" `
            -Recurse `
            -Force

          Copy-Item `
            ".\browser_extension\firefox" `
            ".\dist\UwUConverter\browser-extension\firefox" `
            -Recurse `
            -Force

          New-Item -ItemType Directory -Force ".\dist\UwUConverter\modern-shell" | Out-Null

          Copy-Item ".\dist-modern-shell\UwUConverterShell.dll" ".\dist\UwUConverter\modern-shell\UwUConverterShell.dll" -Force
          Copy-Item ".\dist-modern-shell\UwUConverterShell.msix" ".\dist\UwUConverter\modern-shell\UwUConverterShell.msix" -Force
          Copy-Item ".\dist-modern-shell\UwUConverterShell.cer" ".\dist\UwUConverter\modern-shell\UwUConverterShell.cer" -Force
          Copy-Item ".\windows_modern_shell\register_shell.ps1" ".\dist\UwUConverter\modern-shell\register_shell.ps1" -Force
          Copy-Item ".\windows_modern_shell\unregister_shell.ps1" ".\dist\UwUConverter\modern-shell\unregister_shell.ps1" -Force

      - name: Verify build
        shell: pwsh
        run: |
          $files = @(
            ".\dist\UwUConverter\UwUConverter.exe",
            ".\dist\UwUConverter\UwUConverterBatch.exe",
            ".\dist\UwUConverter\cli\UwUConverter.exe",
            ".\dist\UwUConverterUpdater.exe",
            ".\dist\UwUConverter\UwUConverterUpdater.exe",
            ".\dist-browser-host\UwUConverterBrowserHost.exe",
            ".\dist\UwUConverter\UwUConverterBrowserHost.exe"
          )

          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "Missing executable: $file"
            }

            $size = (Get-Item $file).Length

            if ($size -le 0) {
              throw "Executable is empty: $file"
            }

            Write-Host "$file -> $size bytes"
          }

          if (!(Test-Path ".\dist\UwUConverter\browser-extension\chromium\manifest.json")) {
            throw "Chromium extension was not copied into the portable package"
          }

          if (!(Test-Path ".\dist\UwUConverter\browser-extension\firefox\manifest.json")) {
            throw "Firefox extension was not copied into the portable package"
          }

          foreach ($file in @(
            ".\dist\UwUConverter\modern-shell\UwUConverterShell.dll",
            ".\dist\UwUConverter\modern-shell\UwUConverterShell.msix",
            ".\dist\UwUConverter\modern-shell\UwUConverterShell.cer",
            ".\dist\UwUConverter\modern-shell\register_shell.ps1",
            ".\dist\UwUConverter\modern-shell\unregister_shell.ps1"
          )) {
            if (!(Test-Path $file)) {
              throw "Modern shell file missing from final package: $file"
            }
          }

          & ".\dist\UwUConverter\cli\UwUConverter.exe" --version
          & ".\dist\UwUConverter\cli\UwUConverter.exe" --help

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\installer.iss"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: UwUConverter-Windows-Portable
          path: dist/UwUConverter/
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UwUConverter-Windows-Installer
          path: installer-output/*.exe
          if-no-files-found: error

      - name: Upload browser extensions
        uses: actions/upload-artifact@v4
        with:
          name: UwUConverter-Browser-Extensions
          path: browser_extension/dist/*.zip
          if-no-files-found: error
